name: 🤖 Copilot Agents - Segurança & Qualidade

on:
  schedule:
    # Análise de Segurança - Diária às 02:00 UTC
    - cron: '0 2 * * *'
    
    # Análise de Testes - Diária às 03:00 UTC
    - cron: '0 3 * * *'
    
    # Análise de Performance - Terça-feira às 04:00 UTC
    - cron: '0 4 * * 2'
    
  issues:
    types: [opened, labeled, reopened]
  
  pull_request:
    types: [opened, synchronize, reopened]
  
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Tipo de análise'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - security
          - tests
          - performance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  
  # 1️⃣ ANÁLISE DE SEGURANÇA
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, '🔒 security') ||
      contains(github.event.pull_request.labels.*.name, '🔒 security')
    
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🔒 Execute Security Audit
        run: bash scripts/security-audit.sh
        continue-on-error: true
      
      - name: 📊 Generate Security Report
        id: security-report
        run: |
          if [ -f ".audit-reports/security-"* ]; then
            REPORT=$(cat .audit-reports/security-* 2>/dev/null | tail -100)
            echo "report<<EOF" >> $GITHUB_OUTPUT
            echo "$REPORT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && steps.security-report.outputs.report
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.security-report.outputs.report }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Audit Report\n\n${report}`
            });
      
      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: .audit-reports/
          retention-days: 30
      
      - name: 📢 Notify on Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "⚠️ TELEGRAM_TOKEN não configurado"
            exit 0
          fi
          
          REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>🔒 Security Audit Concluído</b>%0A%0ARun: <a href='${REPORT_URL}'>Ver Detalhes</a>" \
            -d disable_web_page_preview="true"

  # 2️⃣ ANÁLISE DE TESTES
  test-analysis:
    name: 🧪 Test Analysis
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, '🧪 test-coverage') ||
      contains(github.event.pull_request.labels.*.name, '🧪 test-coverage')
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: 🧪 Execute Test Analysis
        run: bash scripts/test-analysis.sh
        continue-on-error: true
      
      - name: 🧪 Run Tests
        run: npm test -- --coverage --passWithNoTests 2>&1 | tee .test-reports/test-output.txt || true
        continue-on-error: true
      
      - name: 📤 Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: .test-reports/
          retention-days: 30
      
      - name: 📊 Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: 📢 Notify on Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            exit 0
          fi
          
          REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>🧪 Test Analysis Concluído</b>%0A%0ARun: <a href='${REPORT_URL}'>Ver Detalhes</a>" \
            -d disable_web_page_preview="true"

  # 3️⃣ ANÁLISE DE PERFORMANCE
  performance-analysis:
    name: ⚡ Performance Analysis
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, '🚀 performance') ||
      contains(github.event.pull_request.labels.*.name, '🚀 performance')
    
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: ⚡ Execute Performance Analysis
        run: bash scripts/performance-analysis.sh
        continue-on-error: true
      
      - name: 📤 Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: .performance-reports/
          retention-days: 30
      
      - name: 📢 Notify on Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            exit 0
          fi
          
          REPORT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>⚡ Performance Analysis Concluído</b>%0A%0ARun: <a href='${REPORT_URL}'>Ver Detalhes</a>" \
            -d disable_web_page_preview="true"

  # 4️⃣ CRIAR ISSUES PARA MELHORIAS
  create-improvement-issues:
    name: 📝 Create Issues
    runs-on: ubuntu-latest
    needs: [security-audit, test-analysis, performance-analysis]
    if: always()
    
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Check Reports
        id: check-reports
        run: |
          SECURITY_ISSUES=0
          TEST_ISSUES=0
          PERF_ISSUES=0
          
          [ -f ".audit-reports/security-"* ] && SECURITY_ISSUES=1
          [ -f ".test-reports/coverage-"* ] && TEST_ISSUES=1
          [ -f ".performance-reports/analysis-"* ] && PERF_ISSUES=1
          
          echo "security=$SECURITY_ISSUES" >> $GITHUB_OUTPUT
          echo "tests=$TEST_ISSUES" >> $GITHUB_OUTPUT
          echo "performance=$PERF_ISSUES" >> $GITHUB_OUTPUT
      
      - name: 📝 Create Security Issue
        if: steps.check-reports.outputs.security == '1'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security Audit - Review Required',
              body: '**Automated security audit found issues**\n\nPlease review the [latest run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).',
              labels: ['🔒 security', 'automated']
            });
        continue-on-error: true
      
      - name: 📝 Create Test Issue
        if: steps.check-reports.outputs.tests == '1'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🧪 Test Coverage - Improvement Needed',
              body: '**Test analysis found gaps in coverage**\n\nPlease review the [latest run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).',
              labels: ['🧪 test-coverage', 'automated']
            });
        continue-on-error: true
      
      - name: 📝 Create Performance Issue
        if: steps.check-reports.outputs.performance == '1'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚡ Performance Optimization Opportunities',
              body: '**Performance analysis found optimization opportunities**\n\nPlease review the [latest run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).',
              labels: ['🚀 performance', 'automated']
            });
        continue-on-error: true
